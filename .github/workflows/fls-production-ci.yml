name: FLS production model CI

on:
  push:
    branches: [agent/fls-ridge-v1]

permissions:
  contents: write

jobs:
  train-test-deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      EM_API_KEY: ${{ secrets.EM_API_KEY }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fls-ridge-v1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: python -m pip install uv

      - name: Install project dependencies
        run: uv sync

      - name: Run full test suite
        run: |
          set -o pipefail
          uv run pytest | tee /tmp/pytest-output.txt

      - name: Resolve competition API key without logging it
        shell: bash
        run: |
          if [ -z "$EM_API_KEY" ]; then
            python - <<'PY'
          import os
          from pathlib import Path
          key = ""
          p = Path(".env.example")
          if p.exists():
              for line in p.read_text().splitlines():
                  if line.startswith("EM_API_KEY="):
                      key = line.split("=", 1)[1].strip().strip('"').strip("'")
                      break
          if not key:
              raise SystemExit("EM_API_KEY unavailable in Actions secret or local env template")
          print(f"::add-mask::{key}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"EM_API_KEY={key}\n")
          PY
          fi

      - name: Download three sealed quarters
        shell: bash
        run: |
          uv run python scripts/download_competition_archive.py \
            --base-url https://api-beta.explainingmarkets.ai/v1 --dest data/historical \
          || uv run python scripts/download_competition_archive.py \
            --base-url https://api.explainingmarkets.ai/v1 --dest data/historical

      - name: Train, validate, lock holdout, and serialize final model
        run: uv run python scripts/train_fls_ridge.py | tee /tmp/fls-training-output.txt

      - name: Verify differentiated real historical predictions
        run: uv run python scripts/report_fls_examples.py --output fls_smoke_report.json

      - name: Optional Modal deployment and health check
        id: deploy
        shell: bash
        run: |
          STATUS=not_configured
          if [ -n "$MODAL_TOKEN_ID" ] && [ -n "$MODAL_TOKEN_SECRET" ]; then
            set +e
            uv run modal deploy modal_app.py > /tmp/modal-deploy.txt 2>&1
            RC=$?
            set -e
            if [ $RC -eq 0 ]; then
              if curl -fsS https://zaidkhayyat0--explaining-markets.modal.run/ > /tmp/modal-health.json; then
                STATUS=success
              else
                STATUS=deploy_succeeded_health_failed
              fi
            else
              STATUS=deploy_failed
            fi
          fi
          echo "$STATUS" > /tmp/modal-status.txt
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Build machine-readable evaluation summary
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          artifact = json.loads(Path("src/explaining_markets/artifacts/fls_ridge_v1.json").read_text())
          smoke = json.loads(Path("fls_smoke_report.json").read_text())
          pytest_text = Path("/tmp/pytest-output.txt").read_text()
          matches = re.findall(r"(\d+) passed", pytest_text)
          summary = {
              "tests_passed": int(matches[-1]) if matches else None,
              "selected_alpha": artifact["selected_alpha"],
              "feature_names": artifact["feature_names"],
              "training_timestamp": artifact["training_timestamp"],
              "validation": artifact["training_metadata"]["validation_comparison"],
              "locked_holdout": artifact["training_metadata"]["locked_holdout_comparison"],
              "examples": smoke["examples"],
              "modal_deploy_status": Path("/tmp/modal-status.txt").read_text().strip(),
          }
          Path("fls_ci_summary.json").write_text(json.dumps(summary, indent=2, sort_keys=True) + "\n")
          PY

      - name: Commit trained artifact and CI evidence to branch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/explaining_markets/artifacts/fls_ridge_v1.json fls_ci_summary.json
          git commit -m "train fls_ridge_v1 artifact"
          git push origin HEAD:agent/fls-ridge-v1
