name: Temporary FLS PR validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate-train:
    runs-on: ubuntu-latest
    env:
      EM_API_KEY: ${{ secrets.EM_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv sync
      - name: Full tests
        run: |
          set -o pipefail
          uv run pytest | tee pytest-output.txt
      - name: Resolve competition API key without logging it
        shell: bash
        run: |
          if [ -z "$EM_API_KEY" ]; then
            python - <<'PY'
          import os
          from pathlib import Path
          key = ""
          for line in Path(".env.example").read_text().splitlines():
              if line.startswith("EM_API_KEY="):
                  key = line.split("=", 1)[1].strip().strip('"').strip("'")
                  break
          if not key:
              raise SystemExit("EM_API_KEY unavailable")
          print(f"::add-mask::{key}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"EM_API_KEY={key}\n")
          PY
          fi
      - name: Download sealed quarters
        shell: bash
        run: |
          uv run python scripts/download_competition_archive.py --base-url https://api-beta.explainingmarkets.ai/v1 --dest data/historical \
          || uv run python scripts/download_competition_archive.py --base-url https://api.explainingmarkets.ai/v1 --dest data/historical
      - name: Train and serialize
        run: uv run python scripts/train_fls_ridge.py | tee fls-training-output.txt
      - name: Historical differentiated smoke predictions
        run: uv run python scripts/report_fls_examples.py --output fls_smoke_report.json
      - name: Build CI summary
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          artifact = json.loads(Path("src/explaining_markets/artifacts/fls_ridge_v1.json").read_text())
          smoke = json.loads(Path("fls_smoke_report.json").read_text())
          matches = re.findall(r"(\d+) passed", Path("pytest-output.txt").read_text())
          summary = {
              "tests_passed": int(matches[-1]) if matches else None,
              "selected_alpha": artifact["selected_alpha"],
              "feature_names": artifact["feature_names"],
              "validation": artifact["training_metadata"]["validation_comparison"],
              "locked_holdout": artifact["training_metadata"]["locked_holdout_comparison"],
              "examples": smoke["examples"],
          }
          Path("fls_ci_summary.json").write_text(json.dumps(summary, indent=2, sort_keys=True) + "\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fls-ridge-ci-output
          path: |
            src/explaining_markets/artifacts/fls_ridge_v1.json
            fls_ci_summary.json
            pytest-output.txt
