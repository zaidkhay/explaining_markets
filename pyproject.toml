[project]
name = "explaining-markets-modal-starter"
version = "0.1.0b1"
description = "A minimal Modal starter for the Explaining Markets competition."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "modal>=0.64",
    "fastapi>=0.110",
    "httpx>=0.27",
    "openai>=1.40",
    "pydantic>=2.6",
    # Needed locally so `modal deploy` can read .env via Secret.from_dotenv.
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]
# Offline quantitative research only (feature_store.py / experiment.py /
# backtest.py). NOT read by modal_app.py's deploy image — that image's
# dependency list is the explicit `pip_install(...)` call in modal_app.py,
# so adding research-only packages here has zero effect on what gets
# deployed to the live webhook.
research = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
]

# Mirror of the dev/research groups for pip users (`pip install -e ".[dev,research]"`)
# — plain pip doesn't read [dependency-groups]. Keep the lists in sync.
[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]
research = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
]

[tool.uv]
# `uv run` / `uv sync` include these by default so `uv run pytest` picks up
# the research-only tests without an extra `--group research` flag. Deploy
# is unaffected — see the comment on the `research` group above.
default-groups = ["dev", "research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The package is importable via the editable install (which points at src/).
# "." restores only the repo-root entry that the top-level entry scripts
# (predict.py, modal_app.py) need — it does not re-expose the package from root.
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/explaining_markets"]
