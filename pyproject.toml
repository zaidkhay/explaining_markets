[project]
name = "explaining-markets"
version = "0.1.0b1"
description = "Production V3-lite market-reaction forecasting system for Explaining Markets."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "modal>=0.64",
    "fastapi>=0.110",
    "httpx>=0.27",
    "openai>=1.40",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]
# Active offline V3-lite retraining only. These packages are not installed in
# the Modal image unless modal_app.py explicitly adds them.
research = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "pandas>=2.1",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]
research = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "pandas>=2.1",
    "matplotlib>=3.8",
]

[tool.uv]
default-groups = ["dev", "research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/explaining_markets"]
